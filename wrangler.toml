name = "px-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "PX_KV"
id = "c857aba035e64f219780f09f29f72225"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*"]

[vars]
APP_VERSION = "1.1.0"
APP_NAME = "PX Bot"

[triggers]
crons = ["* * * * *"]
